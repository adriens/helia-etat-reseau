name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          python-version: "3.13"

      - name: Install dev dependencies
        run: uv sync --frozen --group dev

      - name: Ruff — check
        run: uv run ruff check .

      - name: Ruff — format check
        run: uv run ruff format --check .

  unit:
    name: Tests unitaires
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests + coverage
        run: |
          uv run pytest tests/test_scraper_unit.py tests/test_geo.py tests/test_models.py \
            -v --cov=helia_etat_reseaux --cov-report=term-missing --cov-fail-under=70
