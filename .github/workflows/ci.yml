name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
          python-version: "3.13"

      - name: Install dev dependencies
        run: uv sync --frozen --group dev

      - name: Ruff — check
        run: uv run ruff check .

      - name: Ruff — format check
        run: uv run ruff format --check .

  unit:
    name: Tests unitaires
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests + coverage
        run: |
          uv run pytest tests/test_scraper_unit.py tests/test_geo.py tests/test_models.py \
            -v --cov=helia_etat_reseaux --cov-report=term-missing --cov-fail-under=70

  live:
    name: Live scrape — helia.nc
    runs-on: ubuntu-latest
    needs: unit
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Scrape réel + contrôle zones inconnues
        run: |
          uv run pytest tests/test_scraper_integration.py \
            --run-integration -v --tb=short \
            -k "test_scrape_returns_results or test_communes_are_official or test_no_unknown_zones" \
            2>&1 | tee pytest-live.log
          exit ${PIPESTATUS[0]}

      - name: Ouvrir une issue si zones inconnues détectées
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('pytest-live.log')
              ? fs.readFileSync('pytest-live.log', 'utf8').slice(-4000)
              : '(log indisponible)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🚨 Live scrape échoué — zones inconnues ou parsing cassé (${new Date().toISOString().slice(0,16)} UTC)`,
              body: [
                '## Détection automatique — scrape helia.nc en échec',
                '',
                `**Run CI :** ${runUrl}`,
                '',
                '**Causes probables :**',
                '- Nouveau quartier/zone apparu sur helia.nc absent de `ZONE_TO_COMMUNE`',
                '- Structure HTML modifiée',
                '',
                '**Extrait du log pytest :**',
                '```',
                log,
                '```',
                '',
                '**Actions :**',
                '- [ ] Identifier la zone inconnue dans le log',
                '- [ ] Ajouter le mapping dans `ZONE_TO_COMMUNE` (scraper.py)',
                '- [ ] Fermer cette issue après merge du fix',
              ].join('\n'),
              labels: ['bug', 'scraper'],
            });
