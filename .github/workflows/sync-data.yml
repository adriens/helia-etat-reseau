name: Sync Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Scrape et synchroniser les maintenances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Checkout data repo
        uses: actions/checkout@v6
        with:
          repository: adriens/helia-etat-reseau-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: _data

      - name: Sync maintenances
        run: uv run python scripts/sync_data.py --data-dir _data

      - name: Commit et push
        working-directory: _data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "data: sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
