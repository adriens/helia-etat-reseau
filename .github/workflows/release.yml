name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-pypi:
    name: Publier sur PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}

  release:
    name: Créer la release GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # historique complet pour les release notes

      - name: Extraire la version du tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Créer la release avec notes auto (PRs mergées)
        uses: actions/github-script@v9
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');

            // Trouver le tag précédent
            const tags = await github.rest.repos.listTags({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              per_page: 10,
            });
            const sorted = tags.data.filter(t => t.name !== tag);
            const previousTag = sorted.length > 0 ? sorted[0].name : null;

            // Générer les release notes via l'API GitHub
            const notes = await github.rest.repos.generateReleaseNotes({
              owner:            context.repo.owner,
              repo:             context.repo.repo,
              tag_name:         tag,
              previous_tag_name: previousTag ?? undefined,
            });

            // Créer la release
            await github.rest.repos.createRelease({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              tag_name:   tag,
              name:       `${tag}`,
              body:       notes.data.body,
              draft:      false,
              prerelease: tag.includes('-'),
            });

            core.info(`Release ${tag} créée avec succès.`);
