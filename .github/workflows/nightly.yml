name: Scraper — validation toutes les 3h

on:
  schedule:
    - cron: "0 */3 * * *"   # toutes les 3h UTC
  workflow_dispatch:

jobs:
  integration:
    name: Tests d'intégration (réseau réel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run integration tests against helia.nc
        run: |
          uv run pytest tests/test_scraper_integration.py \
            --run-integration -v --tb=long 2>&1 | tee pytest-integration.log
          exit ${PIPESTATUS[0]}

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-log-${{ github.run_id }}
          path: pytest-integration.log
          retention-days: 7

      - name: Snapshot HTML fixture (artefact de référence)
        if: always()
        run: |
          uv run python3 -c "
          import requests, pathlib, datetime
          r = requests.get('https://helia.nc/etat-du-reseau', timeout=20,
              headers={'User-Agent':'helia-scraper-ci/1.0'})
          ts = datetime.datetime.utcnow().strftime('%Y%m%d_%H%M')
          pathlib.Path(f'snapshot_{ts}.html').write_text(r.text, encoding='utf-8')
          print(f'Snapshot saved — {len(r.text)} chars, HTTP {r.status_code}')
          "

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: helia-snapshot-${{ github.run_id }}
          path: snapshot_*.html
          retention-days: 30

  open-issue-on-failure:
    name: Ouvrir une issue en cas d'échec
    runs-on: ubuntu-latest
    needs: integration
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Download pytest log
        uses: actions/download-artifact@v8
        with:
          name: pytest-log-${{ github.run_id }}
          path: .
        continue-on-error: true

      - name: Créer une issue GitHub avec stack trace
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const now = new Date().toISOString();

            let log = '(log indisponible)';
            try {
              const raw = fs.readFileSync('pytest-integration.log', 'utf8');
              // Garder les 5000 derniers caractères pour rester sous la limite GitHub
              log = raw.length > 5000 ? '…(tronqué)\n' + raw.slice(-5000) : raw;
            } catch (_) {}

            // Extraire les lignes FAILED et les blocs d'erreur pour le titre
            const failedLines = (log.match(/^FAILED .+/mg) ?? []).slice(0, 3).join('\n') || 'échec inconnu';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🚨 Scraper helia.nc en échec — ${now.slice(0, 16).replace('T', ' ')} UTC`,
              body: [
                '## Tests d\'intégration en échec',
                '',
                `**Run CI :** ${runUrl}`,
                `**Horodatage :** ${now}`,
                '',
                '**Tests en échec :**',
                '```',
                failedLines,
                '```',
                '',
                '**Causes probables :**',
                '- Nouvelle zone/quartier apparu sur helia.nc absent de `ZONE_TO_COMMUNE`',
                '- Structure HTML de la page modifiée',
                '- Site temporairement inaccessible',
                '',
                '**Stack trace complète :**',
                '<details>',
                '<summary>Afficher le log pytest</summary>',
                '',
                '```',
                log,
                '```',
                '</details>',
                '',
                '**Actions :**',
                '- [ ] Identifier la zone/erreur dans le log ci-dessus',
                '- [ ] Corriger `ZONE_TO_COMMUNE` ou le parseur dans `scraper.py`',
                '- [ ] Fermer cette issue après merge du fix',
              ].join('\n'),
              labels: ['bug', 'scraper'],
            });
