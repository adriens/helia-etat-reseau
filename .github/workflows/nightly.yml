name: Nightly — scraper validation

on:
  schedule:
    - cron: "0 20 * * *"   # 07h00 heure NC (UTC+11) chaque matin
  workflow_dispatch:        # déclenchement manuel possible

jobs:
  unit:
    name: Tests unitaires (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests + coverage
        run: |
          uv run pytest tests/test_scraper_unit.py tests/test_geo.py tests/test_models.py \
            -v --cov=helia_etat_reseaux --cov-report=term-missing --cov-fail-under=70

  integration:
    name: Tests d'intégration (réseau réel)
    runs-on: ubuntu-latest
    needs: unit           # ne tourne que si les unit tests passent
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run integration tests against helia.nc
        run: |
          uv run pytest tests/test_scraper_integration.py \
            --run-integration -v --tb=short

      - name: Snapshot HTML fixture (artefact de référence)
        if: always()
        run: |
          uv run python3 -c "
          import requests, pathlib, datetime
          r = requests.get('https://helia.nc/etat-du-reseau', timeout=20,
              headers={'User-Agent':'helia-nightly-ci/1.0'})
          ts = datetime.datetime.utcnow().strftime('%Y%m%d_%H%M')
          pathlib.Path(f'snapshot_{ts}.html').write_text(r.text, encoding='utf-8')
          print(f'Snapshot saved — {len(r.text)} chars, HTTP {r.status_code}')
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helia-snapshot-${{ github.run_id }}
          path: snapshot_*.html
          retention-days: 30

  notify-failure:
    name: Notification en cas d'échec
    runs-on: ubuntu-latest
    needs: [unit, integration]
    if: failure()
    steps:
      - name: Créer une issue GitHub
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🚨 Nightly build failed — ${new Date().toISOString().slice(0,10)}`,
              body: [
                '## Nightly scraper validation failed',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '**Actions à vérifier :**',
                '- La structure HTML de helia.nc a-t-elle changé ?',
                '- Un nouveau type de zone ou de service est-il apparu ?',
                '- Le site est-il temporairement inaccessible ?',
              ].join('\n'),
              labels: ['bug', 'nightly'],
            });
