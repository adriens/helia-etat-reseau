name: Scraper — validation toutes les 6h

on:
  schedule:
    - cron: "0 */6 * * *"   # toutes les 6h UTC
  workflow_dispatch:

jobs:
  integration:
    name: Tests d'intégration (réseau réel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run integration tests against helia.nc
        run: |
          uv run pytest tests/test_scraper_integration.py \
            --run-integration -v --tb=short

      - name: Snapshot HTML fixture (artefact de référence)
        if: always()
        run: |
          uv run python3 -c "
          import requests, pathlib, datetime
          r = requests.get('https://helia.nc/etat-du-reseau', timeout=20,
              headers={'User-Agent':'helia-scraper-ci/1.0'})
          ts = datetime.datetime.utcnow().strftime('%Y%m%d_%H%M')
          pathlib.Path(f'snapshot_{ts}.html').write_text(r.text, encoding='utf-8')
          print(f'Snapshot saved — {len(r.text)} chars, HTTP {r.status_code}')
          "

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: helia-snapshot-${{ github.run_id }}
          path: snapshot_*.html
          retention-days: 30

  open-issue-on-failure:
    name: Ouvrir une issue en cas d'échec
    runs-on: ubuntu-latest
    needs: integration
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Créer une issue GitHub dédiée
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const now = new Date().toISOString();
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Scraper helia.nc en échec — ${now.slice(0, 16).replace('T', ' ')} UTC`,
              body: [
                '## Le scraper helia.nc est en échec',
                '',
                `**Run :** ${runUrl}`,
                `**Horodatage :** ${now}`,
                '',
                '**Causes probables :**',
                '- La structure HTML de helia.nc a changé',
                '- Un nouveau type de zone ou de service est apparu',
                '- Le site est temporairement inaccessible',
                '',
                '**Actions :**',
                '- [ ] Vérifier le snapshot HTML joint à l\'artefact du run',
                '- [ ] Mettre à jour `ZONE_TO_COMMUNE` ou les parseurs si besoin',
                '- [ ] Fermer cette issue une fois le fix mergé',
              ].join('\n'),
              labels: ['bug', 'scraper'],
            });
