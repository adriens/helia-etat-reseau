[project]
name = "helia-etat-reseaux"
version = "0.6.0"
description = "Scraper des maintenances programmées Helia NC (helia.nc/etat-du-reseau)"
license = { text = "LGPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.2",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.136.3",
    "mcp>=1.27.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42.1",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "opentelemetry-instrumentation-fastapi>=0.63b1",
    "opentelemetry-sdk>=1.42.1",
    "prometheus-fastapi-instrumentator>=8.0.0",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "streamlit>=1.58.0",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
helia-etat-reseaux = "helia_etat_reseaux.cli:main"

[project.optional-dependencies]
api = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "responses>=0.26.1",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.coverage.run]
source = ["helia_etat_reseaux"]
omit   = ["*/cli.py", "*/mcp.py", "*/scheduler.py"]

[tool.coverage.report]
show_missing = true
fail_under   = 70
